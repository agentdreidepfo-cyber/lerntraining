<style>
/* VOICE: ruhig, freundlich, klar – ein Werkzeug für eine Lerntrainerin, kein Büroprogramm
   IDEA: ihr eigenes Briefpapier – Blau und Korallrot aus Logo und Musterband
   PICTURE: der Tagesplan selbst, mit großen hängenden Uhrzeiten
   COLOUR and TYPE: Weiß, Logo-Blau #35388f, Korallrot #e05a4c; Atkinson Hyperlegible
   LAYOUT: Kopfleiste mit Reitern, darunter eine Arbeitsfläche; große Tippflächen fürs iPad */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1022);--paper:light-dark(#f4f4fa,#181a30);--line:light-dark(#dfe0ee,#2b2d4a);--ink:light-dark(#16172b,#ecedf8);--muted:light-dark(#5c5e7c,#a1a3c2);--tinte:light-dark(#35388f,#a9acff);--tinte2:light-dark(#eaeaf8,#23264d);--rot:light-dark(#c8392f,#ff8f85);--rot2:light-dark(#fdeceb,#3c1e22);--head:light-dark(#35388f,#1d1f4d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
.top{background:var(--head);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(3vw,14px) 0;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:#e05a4c}
.top .in{max-width:1240px;margin:0 auto}
.top h1{margin:0 0 10px;font-size:22px;line-height:1.1}
.top h1 small{display:block;font-weight:400;opacity:.8;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:14px}
nav a{flex:none;color:#fff;opacity:.85;padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:700;min-height:44px}
nav a.on{background:#fff;color:#35388f;opacity:1}
main{max-width:1240px;margin:0 auto;padding:20px max(3vw,14px) 80px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.bar h2{margin:0;font-size:30px;line-height:1.1;text-wrap:balance}
h3{font-size:21px;margin:26px 0 10px}
.sp{flex:1}
.ctl{display:flex;gap:8px;flex-wrap:nowrap}
.btn{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;border-radius:12px;border:0;background:var(--tinte);color:light-dark(#fff,#0f1022);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn.ghost{background:var(--tinte2);color:var(--tinte)}
.btn.danger{background:var(--rot2);color:var(--rot)}
.btn.big{min-height:54px;font-size:18px;padding:12px 24px}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--rot);outline-offset:2px}
.muted{color:var(--muted)}
.seg{display:inline-flex;background:var(--tinte2);border-radius:12px;padding:3px}
.seg button{font:inherit;font-weight:700;border:0;background:none;color:var(--tinte);min-height:38px;padding:4px 16px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.15)}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:16px}
.chip{font:inherit;color:inherit;background:var(--paper);border:0;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1.2;min-height:44px}
.chip span,.chip small{font-size:13px;color:var(--muted)}.chip b{font-size:21px}
.chip.today b{color:var(--tinte)}.chip.on{background:var(--tinte);color:light-dark(#fff,#0f1022)}.chip.on b,.chip.on span,.chip.on small{color:inherit}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.agenda{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:18px;overflow:hidden}
.agenda li{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.agenda li:last-child{border-bottom:0}
.agenda .t{font-size:24px;font-weight:700;color:var(--tinte);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.agenda .t small{display:block;font-size:13px;color:var(--muted);font-weight:400}

.tm.off b{text-decoration:line-through;color:var(--muted)}.tm.off .t{color:var(--rot)}

.free{color:var(--muted);margin:2px;font-size:14px}
.sum{color:var(--muted);font-size:15px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools input[type=search]{max-width:380px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{text-align:left;font:inherit;color:inherit;background:var(--paper);border:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card b{font-size:19px}.card.end{opacity:.6}
.tag{align-self:flex-start;background:var(--tinte2);color:var(--tinte);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700}
.panel{background:var(--paper);border-radius:18px;padding:20px;margin-bottom:20px}
.panel h2{margin:0 0 6px;font-size:26px;line-height:1.1}
.big-n{font-size:clamp(30px,5vw,44px);font-weight:700;color:var(--tinte);line-height:1.05;white-space:nowrap}
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0}
.kpis div span{display:block;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:700}
td small{display:block;color:var(--muted);font-size:14px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--tinte2);color:var(--tinte)}.pill.due{background:var(--rot2);color:var(--rot)}.pill.open{background:var(--line);color:var(--ink)}
.tacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.modal{position:fixed;inset:0;background:rgb(10 10 30/.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--bg);border-radius:20px;padding:22px;width:min(560px,100%);box-shadow:0 20px 60px rgb(0 0 0/.3)}
.mbox.wide{width:min(900px,100%)}
.mbox h3{margin:0 0 16px}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px;margin-bottom:12px}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
label.chk{flex-direction:row;align-items:center;gap:10px;font-weight:400;font-size:16px}
label.chk input{width:24px;height:24px;min-height:0;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.note{background:var(--tinte2);border-radius:12px;padding:10px 14px;font-size:15px;margin:8px 0}
.warn{background:var(--rot2);border-radius:12px;padding:10px 14px;font-size:15px;margin:8px 0}
.banner{border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:15px;background:var(--rot2)}
.banner.info{background:var(--tinte2)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.sheetwrap{background:var(--paper);border-radius:12px;padding:8px;overflow:auto;max-height:70vh;margin-bottom:12px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-size:21px;font-weight:700;margin-bottom:10px}
.lrow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-bottom:8px}
.lrow label{margin:0}
.logo-prev{background:#fff;border-radius:12px;padding:10px;display:inline-block;margin-bottom:10px}
.logo-prev img{height:70px;display:block}
.steps ol{margin:0 0 14px;padding-left:22px}
.start{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.start li{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px}
.start li::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--tinte2);color:var(--tinte)}
.start li.done::before{content:"✓";background:var(--tinte);color:light-dark(#fff,#0f1022)}
.start li span{flex:1}
details{margin-top:14px}summary{cursor:pointer;color:var(--tinte);font-weight:700;min-height:44px;display:flex;align-items:center}
.empty{background:var(--paper);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
#print{display:none}
/* Rechnung im Stil des Briefpapiers, Anschrift passend für Fensterumschlag DIN lang */
.inv{width:210mm;min-height:297mm;padding:96mm 17mm 12mm 22mm;background:#fff;color:#1a1a1a;font:10.5pt/1.45 Arial,'Helvetica Neue',sans-serif;position:relative;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}

@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}.tacts{justify-content:flex-start}.lrow{grid-template-columns:1fr 1fr}.strip small{display:none}.agenda li{grid-template-columns:70px minmax(0,1fr)}.agenda li>.btn{grid-column:2;justify-self:start}.agenda .t{font-size:20px}.ctl{width:100%}.ctl .seg{margin-right:auto}.ctl .btn{padding:8px 12px}}

<script>
{
const KEY='lerntraining-rechnungen-v2';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const eur=n=>r2(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const zahl=n=>(+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const de=s=>s?s.split('-').reverse().join('.'):'';
const pISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const deLang=s=>{const d=pISO(s);return d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear()};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const workday=d=>d.getDay()===0?addDays(d,1):d;
const daysBetween=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
const addMin=(zeit,m)=>{const[h,mm]=zeit.split(':').map(Number);const x=h*60+mm+(+m||0);return z(Math.floor(x/60)%24)+':'+z(x%60)};
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const TAGE=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
const monatName=m=>{const[y,mm]=m.split('-');return MON[+mm-1]+' '+y};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const today=()=>iso(new Date());
const byName=(a,b)=>a.name.localeCompare(b.name,'de');
let inFrame=false;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
const standalone=!!navigator.standalone;
const BEREICHE=['Legasthenie','Dyskalkulie','Legasthenie & Dyskalkulie'];
const HINWEISE={k19:'Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.',n21:'Die Leistung ist gemäß § 4 Nr. 21 UStG von der Umsatzsteuer befreit.'};
const DEMO_IBAN='DE00 0000 0000 0000 0000 00';

function blank(){const y=new Date().getFullYear();return{ver:4,demo:false,lastBackup:null,
  settings:{name:'Doris Lutz',titel:'Legasthenie- & Dyskalkulie Training',quali:'Dipl. Legasthenietrainerin EÖDL\nDipl. Dyskalkulietrainerin EÖDL\nDipl. Lerndidaktikerin EÖDL',str:'Austraße 10',ort:'91738 Pfofeld',tel:'09834 1828',mobil:'0175 4859268',mail:'lutzdoris@aol.com',iban:'',bic:'',bank:'VR Bank im südlichen Franken eG',stnr:'',ust:'inkl',ustSatz:19,hinweis:HINWEISE.k19,ziel:14,nrJahr:y,nrNext:1,start:'14:00',ausfall:false,logo:'',briefpapier:true,sndPre:false},
  leistungen:[{id:'schule',name:'Trainingseinheit in der Schule',preis:33,dauer:45,einheiten:1},{id:'std',name:'Trainingseinheit',preis:33,dauer:45,einheiten:1},{id:'test',name:'Eingangstest',preis:66,dauer:90,einheiten:1}],kinder:[],termine:[],rechnungen:[]}}
const isTest=l=>!!l&&/test/i.test(l.name);
const stdL=()=>S.leistungen.find(l=>!isTest(l))||S.leistungen[0];
const testL=()=>S.leistungen.find(isTest);
function migrate(s){const b=blank();s.settings={...b.settings,...s.settings};
  s.leistungen=(s.leistungen||b.leistungen).map(l=>{const n={...l};delete n.art;if(!n.dauer)n.dauer=45;if(!n.einheiten)n.einheiten=1;return n});
  s.kinder=s.kinder||[];s.termine=s.termine||[];s.rechnungen=s.rechnungen||[];

let S;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Achtung: Speichern auf diesem Gerät nicht möglich')}};

const kind=id=>S.kinder.find(k=>k.id===id);
const leist=id=>S.leistungen.find(l=>l.id===id);
const billable=t=>!t.abgesagt||t.ausfall;
function satzVon(t){const l=leist(t.lid),k=kind(t.kindId);if(!l)return 0;return !isTest(l)&&k&&k.satz!==''&&k.satz!=null?+k.satz:+l.preis}
const preisVon=t=>r2((+t.einheiten||1)*satzVon(t));
function posText(t){const l=leist(t.lid);return t.abgesagt&&t.ausfall?'Ausfallhonorar (kurzfristig abgesagt)':l?l.name:'Trainingseinheit'}
const stLabel=t=>t.abgesagt?(t.grund==='ferien'?'Ferien':t.ausfall?'Ausfall – wird berechnet':'abgesagt'):'';
function nextNr(datum){const y=+datum.slice(0,4);if(S.settings.nrJahr!==y){S.settings.nrJahr=y;S.settings.nrNext=1}return y+' '+String(S.settings.nrNext++).padStart(3,'0')}
const pending=m=>S.termine.filter(t=>t.datum.startsWith(m)&&t.datum<=today()&&billable(t)&&!t.rechnungId&&kind(t.kindId));
function groupPending(m){const by={};pending(m).forEach(t=>(by[t.kindId]=by[t.kindId]||[]).push(t));return Object.keys(by).map(id=>({k:kind(id),ts:by[id].sort((a,b)=>(a.datum+a.zeit).localeCompare(b.datum+b.zeit))})).sort((a,b)=>byName(a.k,b.k))}
function createInvoices(m,datum){
  return groupPending(m).map(({k,ts})=>{
    const pos=ts.map(t=>({datum:t.datum,text:posText(t),einheiten:+t.einheiten||1,satz:satzVon(t),betrag:preisVon(t)}));
    const r={id:uid(),nr:nextNr(datum),kindId:k.id,kname:k.name,bereich:k.bereich,empf:k.empf,str:k.str,ort:k.ort,datum,faellig:iso(addDays(pISO(datum),+S.settings.ziel||14)),monat:m,pos,summe:r2(pos.reduce((a,p)=>a+p.betrag,0)),bezahlt:null,erinnert:null};
    ts.forEach(t=>t.rechnungId=r.id);S.rechnungen.push(r);return r;
  });
}
const overdue=r=>!r.bezahlt&&today()>r.faellig;
function status(r){if(r.bezahlt)return`<span class="pill ok">bezahlt ${de(r.bezahlt.datum)}</span>`;if(overdue(r))return`<span class="pill due">überfällig${r.erinnert?' · erinnert '+de(r.erinnert).slice(0,6):''}</span>`;return'<span class="pill open">offen</span>'}
function festerTermin(k){const t=S.termine.filter(t=>t.kindId===k.id&&t.datum>=today()&&!t.abgesagt).sort((a,b)=>(a.datum+a.zeit).localeCompare(b.datum+b.zeit))[0];return t?`${WT[pISO(t.datum).getDay()]} ${t.zeit}`:''}
const logoSrc=()=>S.settings.logo||'logo.png';

function parseCSV(txt){txt=txt.replace(/^﻿/,'');const head=txt.split(/\r?\n/).slice(0,20).join('\n');const cnt=c=>head.split(c).length;const d=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()))}
const amt=s=>{s=String(s||'').replace(/[€\s+]|EUR/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const norm=s=>String(s).toLowerCase().replace(/[\s\-\/.]+/g,'');
function runMatch(txt){
  const rows=parseCSV(txt);const hi=rows.findIndex(r=>r.some(c=>/betrag|haben/i.test(c)));
  if(hi<0)return{err:'In der Datei wurde keine Spalte „Betrag“ gefunden. Bitte die Umsätze als CSV exportieren.'};
  const H=rows[hi].map(c=>c.toLowerCase().trim()),col=re=>H.findIndex(c=>re.test(c));
  const bi=col(/betrag/),hb=col(/^haben/),ni=col(/zahlungspflichtig|auftraggeber|zahlungsbeteiligt|beguenstigt|begünstigt|empfänger|^name/),di=col(/buchung|datum|valuta/),vi=col(/verwendung|buchungstext|zweck/);
  const open=S.rechnungen.filter(r=>!r.bezahlt),used=new Set(),out=[];let rest=0;
  const words=r=>(r.kname+' '+r.empf).toLowerCase().split(/[^a-zäöüß]+/).filter(w=>w.length>=3&&!['familie','fam','frau','herr','und','von'].includes(w));
  for(const r of rows.slice(hi+1)){
    const b=hb>=0&&r[hb]?amt(r[hb]):amt(r[bi]);if(!(b>0))continue;
    const text=r.join(' '),nt=norm(text),lt=text.toLowerCase();
    const hits=open.filter(x=>!used.has(x.id)&&nt.includes(norm(x.nr)));let typ=null,ids=[];
    if(hits.length){ids=hits.map(x=>x.id);typ=Math.abs(hits.reduce((a,x)=>a+x.summe,0)-b)<0.01?'sicher':'abweichung'}
    else{const c=open.find(x=>!used.has(x.id)&&Math.abs(x.summe-b)<0.01&&words(x).some(w=>lt.includes(w)));if(c){ids=[c.id];typ='vorschlag'}}
    if(typ){ids.forEach(i=>used.add(i));out.push({datum:di>=0?r[di]:'',name:ni>=0?r[ni]:'',zweck:(vi>=0?r[vi]:'').slice(0,90),betrag:b,ids,typ})}else rest++;
  }
  return{out,rest};
}
function sampleCsv(){const o=S.rechnungen.filter(r=>!r.bezahlt);const d=de(today());const f=n=>n.toFixed(2).replace('.',',');
  const L=['Buchungstag;Valutadatum;Name Zahlungsbeteiligter;Verwendungszweck;Betrag (€)',`${d};${d};Stadtwerke;Abschlag Strom;-58,00`];
  o.forEach((r,i)=>{if(i===0)L.push(`${d};${d};${r.empf};Rechnung ${r.nr};${f(r.summe)}`);else if(i===1)L.push(`${d};${d};${r.empf.replace('Fam. ','')};Lerntraining ${r.kname.split(' ')[0]};${f(r.summe)}`);else L.push(`${d};${d};${r.empf};RE ${r.nr.replace(' ','')};${f(r.summe)}`)});
  L.push(`${d};${d};Krankenkasse;Erstattung;23,40`);return L.join('\n')}
async function backup(){
  const data=JSON.stringify(S),name=`lerntraining-sicherung-${today()}.json`;let ok=false;
  try{const file=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Lerntraining Sicherung'});ok=true}}catch(e){if(e&&e.name==='AbortError')return}
  if(!ok){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove();ok=!inFrame}catch(e){}}
  if(inFrame){toast('In der Vorschau kann keine Datei gespeichert werden.');return}
  if(ok){S.lastBackup=today();save();render();toast('Sicherung gespeichert')}
}
function markFerien(von,bis,undo){let n=0;S.termine.forEach(t=>{if(t.datum>=von&&t.datum<=bis&&!t.rechnungId){if(undo&&t.grund==='ferien'){t.abgesagt=false;t.grund=null;n++}else if(!undo&&!t.abgesagt){t.abgesagt=true;t.ausfall=false;t.grund='ferien';n++}}});save();close();render();toast(undo?`${n} Termine wieder aktiv`:`${n} Termine als Ferien markiert`)}
function loadLogo(file){const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const w=Math.min(1000,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);S.settings.logo=c.toDataURL('image/png');save();logoPre.src=logoSrc();render();toast('Logo übernommen')};img.onerror=()=>toast('Das Bild konnte nicht gelesen werden.');img.src=rd.result};rd.readAsDataURL(file)}

const A={
  close,
  askBtn:d=>{const b=askBtns[+d.i];close();b&&b.fn&&b.fn()},
  nav:d=>{const n=+d.d;if(!n)curDay=workday(new Date());else{curDay=addDays(curDay,n);if(curDay.getDay()===0)curDay=addDays(curDay,n>0?1:-1)}render()},
  day:d=>{curDay=pISO(d.date);calView='tag';render()},
  view:d=>{calView=d.v;render()},
  abg:d=>{const t=S.termine.find(x=>x.id===d.id),k=kind(t.kindId);
    const set=a=>{t.abgesagt=true;t.ausfall=a;t.grund='abgesagt';save();render();toast(a?'Abgesagt – Ausfall wird berechnet':'Als abgesagt markiert')};
    if(t.abgesagt){t.abgesagt=false;t.ausfall=false;t.grund=null;save();render();return}
    if(S.settings.ausfall)ask(`${esc(k?.name||'')} hat abgesagt`,[{label:'Nicht berechnen',fn:()=>set(false)},{label:'Ausfallhonorar berechnen',cls:'danger',fn:()=>set(true)},{label:'Abbrechen',cls:'ghost'}],'Bei kurzfristigen Absagen kann der Termin trotzdem berechnet werden.');else set(false)},
  ferien:()=>{const v=iso(curDay),b=iso(addDays(curDay,13));modal(`<h3>Ferien oder freie Tage</h3><p class="muted">Alle Termine in diesem Zeitraum werden als „Ferien“ markiert und nicht berechnet. Die wöchentlichen Termine laufen danach normal weiter.</p><form id="f"><div class="row"><label>Von<input type="date" name="von" value="${v}" required></label><label>Bis einschließlich<input type="date" name="bis" value="${b}" required></label></div><p class="note" id="fcount"></p><div class="acts"><button type="button" class="btn ghost" data-act="ferienUndo">Ferien wieder aufheben</button><span class="sp"></span><button type="button" class="btn ghost" data-act="close">Abbrechen</button><button class="btn">Als Ferien eintragen</button></div></form>`,fd=>{const v=Object.fromEntries(fd);markFerien(v.von,v.bis,false)});ferienCount()},
  ferienUndo:()=>{const f=$('#f');markFerien(f.von.value,f.bis.value,true)},
  newTermin:d=>terminForm(newTerminDefaults(d.date,''),true),
  editTermin:d=>{const t=S.termine.find(x=>x.id===d.id);t&&terminForm(t,false)},
  delTermin:d=>{const t=S.termine.find(x=>x.id===d.id);const del=all=>{S.termine=S.termine.filter(x=>x.id!==t.id&&!(all&&t.serie&&x.serie===t.serie&&x.datum>=t.datum&&!x.rechnungId));save();render();toast('Gelöscht')};
    const serie=t.serie&&S.termine.some(x=>x.serie===t.serie&&x.id!==t.id&&x.datum>t.datum);
    ask('Termin löschen?',[{label:'Nur diesen Termin',cls:'danger',fn:()=>del(false)},...(serie?[{label:'Diesen und alle folgenden',cls:'danger',fn:()=>del(true)}]:[]),{label:'Abbrechen',cls:'ghost'}],serie?'Tipp: Für einzelne Absagen lieber „Abgesagt“ nutzen, für Urlaub „Ferien / frei“.':'')},
  editKind:d=>kindForm(d.id?kind(d.id):null),
  delKind:d=>ask('Kind und alle offenen Termine löschen?',[{label:'Löschen',cls:'danger',fn:()=>{S.kinder=S.kinder.filter(k=>k.id!==d.id);S.termine=S.termine.filter(t=>t.kindId!==d.id);save();render();toast('Gelöscht')}},{label:'Abbrechen',cls:'ghost'}],'Wenn das Training nur beendet ist, besser den Haken „Training läuft noch“ entfernen.'),
  makeInv:()=>{const neu=createInvoices(selMonth,today());save();render();ask(`${neu.length} Rechnung${neu.length>1?'en':''} für ${monatName(selMonth)} erstellt.`,[{label:'Jetzt drucken',fn:()=>doPrint(neu.map(invHTML).join(''))},{label:'Später',cls:'ghost'}])},
  printMonth:()=>doPrint(S.rechnungen.filter(r=>r.monat===selMonth).sort((a,b)=>a.nr.localeCompare(b.nr)).map(invHTML).join('')),
  showInv:d=>showInv(S.rechnungen.find(r=>r.id===d.id)),
  printOne:d=>doPrint(invHTML(S.rechnungen.find(r=>r.id===d.id))),
  remind:d=>{const r=S.rechnungen.find(x=>x.id===d.id);r.erinnert=today();save();render();doPrint(remHTML(r))},
  remindAll:()=>{const l=S.rechnungen.filter(overdue).sort((a,b)=>a.nr.localeCompare(b.nr));l.forEach(r=>r.erinnert=today());save();render();doPrint(l.map(remHTML).join(''))},
  paid:d=>{const r=S.rechnungen.find(x=>x.id===d.id);r.bezahlt=r.bezahlt?null:{datum:today(),quelle:'manuell'};save();render()},
  storno:d=>ask('Rechnung stornieren?',[{label:'Stornieren',cls:'danger',fn:()=>{S.rechnungen=S.rechnungen.filter(r=>r.id!==d.id);S.termine.forEach(t=>{if(t.rechnungId===d.id)t.rechnungId=null});save();render();toast('Storniert')}},{label:'Abbrechen',cls:'ghost'}],'Die Termine werden wieder frei und können neu abgerechnet werden. Die Rechnungsnummer wird nicht neu vergeben.'),
  sampleCsv:()=>{match=runMatch(sampleCsv());render()},
  csvText:()=>{const v=$('#csvtext').value;if(v.trim()){match=runMatch(v);render()}},
  csvApply:()=>{let n=0;document.querySelectorAll('[data-i]:checked').forEach(c=>{const m=match.out[+c.dataset.i];m.ids.forEach(id=>{const r=S.rechnungen.find(x=>x.id===id);if(r&&!r.bezahlt){r.bezahlt={datum:today(),quelle:'CSV'};n++}})});save();match=null;render();toast(`${n} Rechnung${n===1?'':'en'} als bezahlt markiert`)},
  hinweis:d=>{$('#settings [name=hinweis]').value=HINWEISE[d.k];readSettings();save();toast('Hinweis übernommen')},
  addL:()=>{readSettings();S.leistungen.push({id:uid(),name:'Neue Leistung',preis:33,dauer:45,einheiten:1});save();render()},
  delL:d=>{readSettings();S.leistungen=S.leistungen.filter(l=>l.id!==d.id);save();render()},
  probe:()=>{readSettings();save();const s=S.settings,l=stdL(),d=today(),ds=[7,14,21].map(n=>iso(addDays(new Date(),-n))).reverse();
    const pos=ds.map(x=>({datum:x,text:l.name,einheiten:1,satz:+l.preis,betrag:+l.preis}));
    const r={id:'probe',nr:new Date().getFullYear()+' '+String(s.nrNext).padStart(3,'0'),kname:'Max Mustermann',bereich:'Legasthenie',empf:'Fam. Mustermann',str:'Musterstraße 1',ort:'91738 Pfofeld',datum:d,faellig:iso(addDays(new Date(),+s.ziel||14)),monat:d.slice(0,7),pos,summe:r2(pos.reduce((a,p)=>a+p.betrag,0))};
    modal(`<h3>Probe-Rechnung</h3><p class="muted">Nur zum Testen – wird nicht gespeichert und verbraucht keine Rechnungsnummer.</p><div class="sheetwrap" id="sw">${invHTML(r)}</div><div class="acts"><span class="sp"></span><button class="btn ghost" data-act="close">Schließen</button><button class="btn" data-act="probePrint">Probe drucken</button></div>`,null,true);probeR=r;
    const sw=$('#sw'),inv=sw.querySelector('.inv');inv.style.zoom=Math.min(1,(sw.clientWidth-16)/794)},
  probePrint:()=>probeR&&doPrint(invHTML(probeR)),
  logoReset:()=>{S.settings.logo='';save();logoPre.src=logoSrc();render()},
  backup,
  clearDemo:()=>ask('Alle Beispieldaten löschen und mit eigenen Daten starten?',[{label:'Ja, löschen',cls:'danger',fn:()=>{const keep=S.settings,ls=S.leistungen;S=blank();S.settings={...keep,nrNext:1,nrJahr:new Date().getFullYear(),iban:keep.iban===DEMO_IBAN?'':keep.iban};S.leistungen=ls;save();location.hash='#kalender';route();toast('Los geht’s – zuerst IBAN und Steuernummer eintragen')}},{label:'Abbrechen',cls:'ghost'}],'Briefkopf, Logo und Preise bleiben erhalten. Kinder, Termine und Rechnungen werden gelöscht.')
};
function readSettings(){const f=$('#settings');if(!f)return false;let oldBp;const v=Object.fromEntries(new FormData(f));const s=S.settings,oldUst=s.ust;
  ['name','titel','quali','str','ort','tel','mobil','mail','iban','bic','bank','stnr','start','ust'].forEach(k=>{if(v[k]!=null)s[k]=v[k]});
  if(v.hinweis!=null)s.hinweis=v.hinweis;if(v.ustSatz!=null)s.ustSatz=+v.ustSatz||0;
  oldBp=s.briefpapier;s.ziel=+v.ziel||0;s.nrNext=Math.max(1,+v.nrNext||1);s.ausfall=!!v.ausfall;s.briefpapier=!!v.briefpapier;s.sndPre=!!v.sndPre;
  S.leistungen.forEach(l=>{if(v['l_name_'+l.id]!=null){l.name=v['l_name_'+l.id];l.preis=+String(v['l_preis_'+l.id]).replace(',','.')||0;l.dauer=+v['l_dauer_'+l.id]||45}});
  $('#apptitle').innerHTML=esc(s.name||'Lerntraining')+' <small>Termine &amp; Rechnungen</small>';
  return oldUst!==s.ust||oldBp!==s.briefpapier}
function ferienCount(){const f=$('#f'),c=$('#fcount');if(!f||!c||!f.von)return;const n=S.termine.filter(t=>t.datum>=f.von.value&&t.datum<=f.bis.value&&!t.abgesagt&&!t.rechnungId).length;c.textContent=`${n} Termin${n===1?'':'e'} in diesem Zeitraum`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='f'&&onSub)onSub(new FormData(e.target))});
document.addEventListener('input',e=>{if(e.target.id==='ksuche'){ksuche=e.target.value;$('#klist').innerHTML=klist()}else if(e.target.closest('#f')&&(e.target.name==='von'||e.target.name==='bis'))ferienCount()});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.chg;
  if(c==='logo'){const file=el.files[0];if(file)loadLogo(file);el.value='';return}
  if(el.closest('#settings')){const changed=readSettings();save();if(changed||['iban','stnr'].includes(el.name)){const y=scrollY;render();scrollTo(0,y)}return}
  const f=el.closest('#f');
  if(f&&f.dataset.new&&el.name==='kindId'){const d=newTerminDefaults(f.datum.value,el.value);f.lid.value=d.lid;f.dauer.value=d.dauer;f.einheiten.value=d.einheiten;return}
  if(f&&el.name==='lid'){const l=leist(el.value);if(l){f.dauer.value=l.dauer;f.einheiten.value=l.einheiten||1}return}
  if(!c)return;
  if(c==='month'){selMonth=el.value;render()}
  else if(c==='kalle'){kalle=el.checked;$('#klist').innerHTML=klist()}
  else if(c==='csv'||c==='restore'){const file=el.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=()=>{let txt=String(rd.result);if(c==='csv'){if(txt.includes(String.fromCharCode(65533))){const r2=new FileReader();r2.onload=()=>{match=runMatch(String(r2.result));render()};r2.readAsText(file,'windows-1252');return}match=runMatch(txt);render()}
      else{try{const d=JSON.parse(txt);if(!d.settings)throw 0;ask('Sicherung laden?',[{label:'Laden',cls:'danger',fn:()=>{S=migrate(d);S.demo=false;save();logoPre.src=logoSrc();render();toast('Sicherung geladen')}},{label:'Abbrechen',cls:'ghost'}],'Die aktuellen Daten auf diesem Gerät werden dabei ersetzt.')}catch(err){toast('Das ist keine gültige Sicherungsdatei.')}}};
    rd.readAsText(file,'utf-8');el.value=''}
});
let tx=0,ty=0;
$('#main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#main').addEventListener('touchend',e=>{if(tab!=='kalender'||!$('#modal').hidden)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<50)A.nav({d:String((dx<0?1:-1)*(calView==='tag'?1:7))})},{passive:true});
route();
}
</script>
